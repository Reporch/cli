name: Fuzz

on:
  schedule:
    - cron: "31 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-11
        with:
          toolchain: nightly-2026-08-11
          components: clippy, rustfmt
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-fuzz@0.13.2
          fallback: none
      - name: Check fuzz harnesses
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Fuzz bounded authoring YAML
        run: cargo fuzz run authoring_yaml -- -max_total_time=240 -rss_limit_mb=4096
      - name: Fuzz normalized project paths
        run: cargo fuzz run relative_path -- -max_total_time=240 -rss_limit_mb=4096
