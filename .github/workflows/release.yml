name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.2.0"
          package-manager-cache: false
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/check-versions.mjs
          node scripts/check-workflows.mjs
          version=$(node -p 'require("./npm/cli/package.json").version')
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "$tag"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/reporch
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/reporch
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/reporch
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/reporch
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/reporch.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-11
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.2.0"
          package-manager-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --workspace --all-targets
      - run: cargo build --locked --release -p reporch-cli --target ${{ matrix.target }}
      - shell: bash
        env:
          VERSION: ${{ needs.verify-source.outputs.version }}
        run: |
          set -euo pipefail
          test "$("${{ matrix.binary }}" --version)" = "reporch $VERSION"
          node scripts/test-current-npm-package.mjs "${{ matrix.target }}" "${{ matrix.binary }}"
          mkdir -p "release-output/${{ matrix.target }}"
          cp "${{ matrix.binary }}" "release-output/${{ matrix.target }}/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: release-output
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [verify-source, build]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify-source.outputs.version }}
      RELEASE_TAG: ${{ needs.verify-source.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.2.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global npm@11.18.0
      - run: test "$(npm --version)" = "11.18.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release-input
          merge-multiple: true
      - run: node scripts/prepare-npm-packages.mjs release-input dist
      - run: node scripts/pack-npm-release.mjs dist
      - run: npm test
      - run: npm run check:versions
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/reporch-cli.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          find dist/tarballs -type f -name '*.tgz' -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          sha256sum --check dist/SHA256SUMS
      - name: Attest immutable npm tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/tarballs/*.tgz
      - name: Create or verify the draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "Reporch CLI $VERSION" \
              --notes "Official Apache-2.0 Reporch CLI release. Install with npm install --global @reporch/cli."
          fi
          gh release upload "$RELEASE_TAG" dist/tarballs/*.tgz dist/SHA256SUMS \
            dist/reporch-cli.spdx.json dist/release-manifest.json dist/npm-pack-manifest.json --clobber
      - name: Publish exact npm tarballs with OIDC and provenance
        run: node scripts/publish-npm-release.mjs dist
      - name: Publish GitHub release after npm verification
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
