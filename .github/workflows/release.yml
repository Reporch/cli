name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  issues: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.2.0"
          package-manager-cache: false
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/check-versions.mjs
          node scripts/check-workflows.mjs
          version=$(node -p 'require("./npm/cli/package.json").version')
          tag="v$version"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "$tag"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          if [ "$version" = 1.0.0 ]; then
            gh issue list --state all --limit 100 --json number,title,createdAt,closedAt \
              > "$RUNNER_TEMP/beta-issues.json"
            latest_number=$(jq -er '
              [ .[]
                | select(.title | test("^Reporch CLI 1\\.0\\.0-rc\\.[0-9A-Za-z.-]+ — 30-day stability window$"))
              ]
              | sort_by(.createdAt)
              | last
              | .number
            ' "$RUNNER_TEMP/beta-issues.json")
            gh issue view "$latest_number" --json comments > "$RUNNER_TEMP/beta-comments.json"
            node scripts/verify-stability-window.mjs \
              "$RUNNER_TEMP/beta-issues.json" "$RUNNER_TEMP/beta-comments.json"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/reporch
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/reporch
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/reporch
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/reporch
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/reporch.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-11
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.2.0"
          package-manager-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --workspace --all-targets
      - run: cargo build --locked --release -p reporch-cli --target ${{ matrix.target }}
      - shell: bash
        env:
          VERSION: ${{ needs.verify-source.outputs.version }}
        run: |
          set -euo pipefail
          test "$("${{ matrix.binary }}" --version)" = "reporch $VERSION"
          node scripts/test-current-npm-package.mjs "${{ matrix.target }}" "${{ matrix.binary }}"
          mkdir -p "release-output/${{ matrix.target }}"
          cp "${{ matrix.binary }}" "release-output/${{ matrix.target }}/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: release-output
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [verify-source, build]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.verify-source.outputs.version }}
      RELEASE_TAG: ${{ needs.verify-source.outputs.tag }}
      IS_PRERELEASE: ${{ needs.verify-source.outputs.prerelease }}
      NPM_TARBALL_URL: https://registry.npmjs.org/npm/-/npm-11.18.0.tgz
      NPM_TARBALL_SHA256: 73f6155215ebabf4ed96dca1f567c2372cc713c33af2e5b9b62fde4e92373e2e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.2.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install the repository-pinned npm release client
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/npm-11.18.0.tgz"
          install_dir="$RUNNER_TEMP/npm-11.18.0"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" "$NPM_TARBALL_URL"
          echo "$NPM_TARBALL_SHA256  $archive" | sha256sum --check --strict
          mkdir "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" \
            --no-same-owner --no-same-permissions
          test -x "$install_dir/package/bin/npm-cli.js"
          shim_dir="$RUNNER_TEMP/npm-11.18.0-bin"
          mkdir "$shim_dir"
          ln -s "$install_dir/package/bin/npm-cli.js" "$shim_dir/npm"
          test "$("$shim_dir/npm" --version)" = "11.18.0"
          echo "$shim_dir" >> "$GITHUB_PATH"
      - run: test "$(npm --version)" = "11.18.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release-input
          merge-multiple: true
      - run: node scripts/prepare-npm-packages.mjs release-input dist
      - run: node scripts/pack-npm-release.mjs dist
      - run: node scripts/pack-native-release.mjs release-input dist/native
      - run: npm test
      - run: npm run check:versions
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/reporch-cli.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist/release-assets
          cp dist/tarballs/*.tgz dist/native/*.tar.gz dist/native/*.zip \
            dist/reporch-cli.spdx.json dist/release-manifest.json \
            dist/npm-pack-manifest.json dist/native/native-release-manifest.json \
            dist/release-assets/
          (cd dist/release-assets && sha256sum ./*) > dist/SHA256SUMS
          (cd dist/release-assets && sha256sum --check --strict ../SHA256SUMS)
      - name: Attest immutable release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/release-assets/*
      - name: Create or verify the draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA"
          else
            release_flags=()
            if [ "$IS_PRERELEASE" = true ]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" "${release_flags[@]}" \
              --title "Reporch CLI $VERSION" \
              --notes $'Official Apache-2.0 Reporch CLI release.\n\nInstall with `npm install --global @reporch/cli`, or download the standalone archive for your target and verify it with `SHA256SUMS`. Every release asset has GitHub artifact provenance; manifests and an SPDX SBOM are included.'
          fi
          gh release upload "$RELEASE_TAG" dist/release-assets/* dist/SHA256SUMS --clobber
      - name: Publish exact npm tarballs with OIDC and provenance
        run: node scripts/publish-npm-release.mjs dist
      - name: Publish GitHub release after npm verification
        shell: bash
        run: |
          set -euo pipefail
          if [ "$IS_PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

  qualify-published-artifacts:
    needs: [verify-source, publish]
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            archive_kind: tar
            npm_package: '@reporch/cli-darwin-arm64'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive_kind: tar
            npm_package: '@reporch/cli-darwin-x64'
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_kind: tar
            npm_package: '@reporch/cli-linux-x64-gnu'
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_kind: tar
            npm_package: '@reporch/cli-linux-arm64-gnu'
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive_kind: zip
            npm_package: '@reporch/cli-win32-x64-msvc'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify-source.outputs.version }}
      RELEASE_TAG: ${{ needs.verify-source.outputs.tag }}
      TARGET: ${{ matrix.target }}
      ARCHIVE_KIND: ${{ matrix.archive_kind }}
      NPM_PACKAGE: ${{ matrix.npm_package }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.2.0"
          package-manager-cache: false

      - name: Download and exercise the published Unix artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          install_dir="$RUNNER_TEMP/native-install"
          npm_dir="$RUNNER_TEMP/npm-install"
          project="$RUNNER_TEMP/authoring-project"
          mkdir "$assets" "$install_dir" "$npm_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          if command -v sha256sum >/dev/null; then
            (cd "$assets" && sha256sum --check --strict SHA256SUMS)
          else
            (cd "$assets" && shasum -a 256 --check SHA256SUMS)
          fi
          archive="$assets/reporch-v${VERSION}-${TARGET}.tar.gz"
          test -f "$archive"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          tar -xzf "$archive" -C "$install_dir"
          native="$install_dir/reporch-v${VERSION}-${TARGET}/reporch"
          test -x "$native"
          test "$("$native" --version)" = "reporch $VERSION"

          cd "$npm_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "@reporch/cli@$VERSION"
          npm_binary="$npm_dir/node_modules/.bin/reporch"
          test -x "$npm_binary"
          test "$("$npm_binary" --version)" = "reporch $VERSION"
          npm_native="$npm_dir/node_modules/$NPM_PACKAGE/bin/reporch"
          test -x "$npm_native"
          cmp "$native" "$npm_native"

          run_flow() {
            local binary=$1
            local evidence=$2
            "$binary" qualification-self-test > "$evidence"
            jq -e --arg version "$VERSION" '
              .schema == "reporch.cli-installed-self-test.v1"
              and .version == $version
              and .credential_store_round_trip == true
              and .generated_manifest_valid == true
              and .generated_authoring_spec_valid == true
              and .problem_type_count == 6
              and .passed == true
            ' "$evidence" >/dev/null
          }
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y dbus-x11 gnome-keyring
            export native npm_binary VERSION
            # The single-quoted child script intentionally receives exported variables.
            # shellcheck disable=SC2016
            dbus-run-session -- bash -euo pipefail -c '
              eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
              "$native" qualification-self-test > "$RUNNER_TEMP/native-self-test.json"
              "$npm_binary" qualification-self-test > "$RUNNER_TEMP/npm-self-test.json"
              "$native" --format json auth status > "$RUNNER_TEMP/auth-status.json"
            '
            for evidence in "$RUNNER_TEMP/native-self-test.json" "$RUNNER_TEMP/npm-self-test.json"; do
              jq -e --arg version "$VERSION" '
                .schema == "reporch.cli-installed-self-test.v1"
                and .version == $version
                and .credential_store_round_trip == true
                and .generated_manifest_valid == true
                and .generated_authoring_spec_valid == true
                and .problem_type_count == 6
                and .passed == true
              ' "$evidence" >/dev/null
            done
          else
            run_flow "$native" "$RUNNER_TEMP/native-self-test.json"
            run_flow "$npm_binary" "$RUNNER_TEMP/npm-self-test.json"
            "$native" --format json auth status > "$RUNNER_TEMP/auth-status.json"
          fi

          "$native" --format json project init --title "RC qualification" --directory "$project" \
            > "$RUNNER_TEMP/project-init.json"
          "$native" --cwd "$project" --format json check > "$RUNNER_TEMP/project-check.json"
          jq -e '.schema == "reporch.cli-result.v1" and .command == "project init"' \
            "$RUNNER_TEMP/project-init.json" >/dev/null
          jq -e '.schema == "reporch.cli-result.v1" and .command == "check"' \
            "$RUNNER_TEMP/project-check.json" >/dev/null
          jq -e '.schema == "reporch.cli-result.v1" and .data.authenticated == false' \
            "$RUNNER_TEMP/auth-status.json" >/dev/null

      - name: Download and exercise the published Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
          $install = Join-Path $env:RUNNER_TEMP 'native-install'
          $npmDir = Join-Path $env:RUNNER_TEMP 'npm-install'
          $project = Join-Path $env:RUNNER_TEMP 'authoring-project'
          New-Item -ItemType Directory $assets, $install, $npmDir | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $assets
          Get-Content (Join-Path $assets 'SHA256SUMS') | ForEach-Object {
            if ($_ -notmatch '^([a-f0-9]{64})  (.+)$') { throw 'invalid checksum entry' }
            $path = Join-Path $assets $Matches[2]
            if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $Matches[1]) {
              throw "checksum mismatch: $path"
            }
          }
          $archive = Join-Path $assets "reporch-v$env:VERSION-$env:TARGET.zip"
          if (!(Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'native archive is missing' }
          gh attestation verify $archive --repo $env:GITHUB_REPOSITORY
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $native = Join-Path $install "reporch-v$env:VERSION-$env:TARGET/reporch.exe"
          if ((& $native --version) -ne "reporch $env:VERSION") { throw 'native version mismatch' }

          Push-Location $npmDir
          npm init --yes | Out-Null
          npm install --ignore-scripts --no-audit --no-fund "@reporch/cli@$env:VERSION"
          Pop-Location
          $npmBinary = Join-Path $npmDir 'node_modules/.bin/reporch.cmd'
          if ((& $npmBinary --version) -ne "reporch $env:VERSION") { throw 'npm version mismatch' }
          $npmNative = Join-Path $npmDir "node_modules/$env:NPM_PACKAGE/bin/reporch.exe"
          if ((Get-FileHash -Algorithm SHA256 $native).Hash -ne (Get-FileHash -Algorithm SHA256 $npmNative).Hash) {
            throw 'npm native binary differs from the independently attested GitHub release binary'
          }
          foreach ($entry in @(
            @{ Binary = $native; Evidence = (Join-Path $env:RUNNER_TEMP 'native-self-test.json') },
            @{ Binary = $npmBinary; Evidence = (Join-Path $env:RUNNER_TEMP 'npm-self-test.json') }
          )) {
            & $entry.Binary qualification-self-test | Set-Content -Encoding utf8 $entry.Evidence
            if ($LASTEXITCODE -ne 0) { throw 'installed qualification self-test failed' }
            $result = Get-Content -Raw $entry.Evidence | ConvertFrom-Json
            if (!$result.passed -or !$result.credential_store_round_trip -or !$result.generated_manifest_valid -or !$result.generated_authoring_spec_valid -or $result.version -ne $env:VERSION) {
              throw 'installed qualification evidence mismatch'
            }
          }
          & $native --format json project init --title 'RC qualification' --directory $project |
            Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'project-init.json')
          if ($LASTEXITCODE -ne 0) { throw 'project initialization failed' }
          & $native --cwd $project --format json check |
            Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'project-check.json')
          if ($LASTEXITCODE -ne 0) { throw 'project check failed' }
          & $native --format json auth status |
            Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'auth-status.json')
          if ($LASTEXITCODE -ne 0) { throw 'auth status failed' }
          $status = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'auth-status.json') | ConvertFrom-Json
          if ($status.schema -ne 'reporch.cli-result.v1' -or $status.data.authenticated) {
            throw 'auth status contract mismatch'
          }

  start-beta-window:
    needs: [verify-source, qualify-published-artifacts]
    if: needs.verify-source.outputs.prerelease == 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.verify-source.outputs.version }}
    steps:
      - name: Start the auditable 30-day stability window after qualification
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^1\.0\.0-rc\.[0-9A-Za-z.-]+$ ]]
          title="Reporch CLI $VERSION — 30-day stability window"
          gh issue list --state all --limit 100 --json number,title,state > "$RUNNER_TEMP/issues.json"
          count=$(jq --arg title "$title" '[.[] | select(.title == $title)] | length' "$RUNNER_TEMP/issues.json")
          test "$count" -le 1
          if [ "$count" = 0 ]; then
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            earliest=$(date -u -d '+30 days' +%Y-%m-%dT%H:%M:%SZ)
            gh issue create --title "$title" --body "RC qualification completed in workflow run $GITHUB_RUN_ID.\n\nStart: $started\nEarliest eligible completion: $earliest\n\nDo not close this issue before 30 full days have elapsed. Close it only after confirming zero critical security, data-loss, or duplicate-publication incidents and attaching the daily/incident evidence. The stable 1.0.0 release workflow verifies the elapsed time, closed state, and at least 30 distinct passing daily monitor records."
          else
            number=$(jq -er --arg title "$title" '.[] | select(.title == $title) | .number' "$RUNNER_TEMP/issues.json")
            state=$(jq -er --arg title "$title" '.[] | select(.title == $title) | .state' "$RUNNER_TEMP/issues.json")
            test "$state" = OPEN
            gh issue comment "$number" --body "Published-artifact qualification passed again in workflow run $GITHUB_RUN_ID."
          fi
