name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  issues: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    if: github.actor == vars.SELF_HOSTED_ACTIONS_ALLOWED_ACTOR
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.2.0"
          package-manager-cache: false
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/check-versions.mjs
          node scripts/check-workflows.mjs
          version=$(node -p 'require("./npm/cli/package.json").version')
          tag="v$version"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "$tag"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    if: github.actor == vars.SELF_HOSTED_ACTIONS_ALLOWED_ACTOR
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            runtime_target: darwin-arm64
            binary: target/aarch64-apple-darwin/release/reporch
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            runtime_target: darwin-x64
            binary: target/x86_64-apple-darwin/release/reporch
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            runtime_target: linux-x64-gnu
            binary: target/x86_64-unknown-linux-gnu/release/reporch
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            runtime_target: linux-arm64-gnu
            binary: target/aarch64-unknown-linux-gnu/release/reporch
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            runtime_target: windows-x64-msvc
            binary: target/x86_64-pc-windows-msvc/release/reporch.exe
    runs-on: "${{ matrix.runner }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-11
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.2.0"
          package-manager-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --workspace --all-targets
      - run: cargo build --locked --release -p reporch-cli --target ${{ matrix.target }}
      - name: Fetch and reconstruct the signed mandatory runtime
        shell: bash
        env:
          RUNTIME_TARGET: ${{ matrix.runtime_target }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/runtime-bundle-$RUNTIME_TARGET"
          tree="$GITHUB_WORKSPACE/release-output/runtime/$RUNTIME_TARGET"
          node scripts/fetch-runtime-bundle.mjs "$RUNTIME_TARGET" "$bundle"
          generated_at=$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1])); process.stdout.write(String(Date.parse(value.generated_at)/1000));' "$bundle/manifest.json")
          mkdir -p "$(dirname "$tree")"
          SOURCE_DATE_EPOCH="$generated_at" cargo run --locked -p reporch-runtime-install-tree-builder -- \
            "$bundle/manifest.json" "$bundle/manifest.json.minisig" \
            "$bundle/artifacts" "$tree"
          node --input-type=module -e \
            'import {assertRuntimeInstallTree} from "./scripts/release-lib.mjs"; assertRuntimeInstallTree(process.argv[1], process.argv[2]);' \
            "$tree" "$RUNTIME_TARGET"
      - name: Sign the native CLI executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          IS_PRERELEASE: ${{ needs.verify-source.outputs.prerelease }}
          MAC_APPLICATION_IDENTITY: ${{ secrets.REPORCH_MAC_APPLICATION_IDENTITY }}
          WINDOWS_CERT_SHA1: ${{ secrets.REPORCH_WINDOWS_CERT_SHA1 }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            *-apple-darwin)
              if [ -n "$MAC_APPLICATION_IDENTITY" ]; then
                codesign --force --options runtime --timestamp \
                  --entitlements installers/macos/reporch.entitlements \
                  --sign "$MAC_APPLICATION_IDENTITY" "${{ matrix.binary }}"
              else
                codesign --force --options runtime --sign - \
                  --entitlements installers/macos/reporch.entitlements \
                  "${{ matrix.binary }}"
              fi
              codesign --verify --strict --verbose=2 "${{ matrix.binary }}"
              ;;
            *-pc-windows-msvc)
              if [ -n "$WINDOWS_CERT_SHA1" ]; then
                signtool sign /sha1 "$WINDOWS_CERT_SHA1" /fd SHA256 \
                  /tr http://timestamp.acs.microsoft.com /td SHA256 "${{ matrix.binary }}"
                signtool verify /pa /all "${{ matrix.binary }}"
              fi
              ;;
          esac
      - shell: bash
        env:
          VERSION: ${{ needs.verify-source.outputs.version }}
          TARGET: ${{ matrix.target }}
          RUNTIME_TARGET: ${{ matrix.runtime_target }}
          IS_PRERELEASE: ${{ needs.verify-source.outputs.prerelease }}
          REPORCH_RELEASE_SIGNING_REQUIRED: ${{ needs.verify-source.outputs.prerelease == 'true' && '0' || '1' }}
          REPORCH_MAC_INSTALLER_IDENTITY: ${{ secrets.REPORCH_MAC_INSTALLER_IDENTITY }}
          REPORCH_WINDOWS_CERT_SHA1: ${{ secrets.REPORCH_WINDOWS_CERT_SHA1 }}
          REPORCH_MAC_NOTARY_PROFILE: ${{ secrets.REPORCH_MAC_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          test "$("${{ matrix.binary }}" --version)" = "reporch $VERSION"
          node scripts/test-current-npm-package.mjs "${{ matrix.target }}" "${{ matrix.binary }}"
          mkdir -p "release-output/${{ matrix.target }}"
          cp "${{ matrix.binary }}" "release-output/${{ matrix.target }}/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: release-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.actor == vars.SELF_HOSTED_ACTIONS_ALLOWED_ACTOR
    needs: [verify-source, build]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.verify-source.outputs.version }}
      RELEASE_TAG: ${{ needs.verify-source.outputs.tag }}
      IS_PRERELEASE: ${{ needs.verify-source.outputs.prerelease }}
      NPM_TARBALL_URL: https://registry.npmjs.org/npm/-/npm-11.18.0.tgz
      NPM_TARBALL_SHA256: 73f6155215ebabf4ed96dca1f567c2372cc713c33af2e5b9b62fde4e92373e2e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.2.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install the repository-pinned npm release client
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/npm-11.18.0.tgz"
          install_dir="$RUNNER_TEMP/npm-11.18.0"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" "$NPM_TARBALL_URL"
          echo "$NPM_TARBALL_SHA256  $archive" | shasum -a 256 --check
          mkdir "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" \
            --no-same-owner --no-same-permissions
          test -x "$install_dir/package/bin/npm-cli.js"
          shim_dir="$RUNNER_TEMP/npm-11.18.0-bin"
          mkdir "$shim_dir"
          ln -s "$install_dir/package/bin/npm-cli.js" "$shim_dir/npm"
          test "$("$shim_dir/npm" --version)" = "11.18.0"
          echo "$shim_dir" >> "$GITHUB_PATH"
      - run: test "$(npm --version)" = "11.18.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release-input
          merge-multiple: true
      - run: node scripts/prepare-npm-packages.mjs release-input dist
      - run: node scripts/pack-npm-release.mjs dist
      - run: node scripts/pack-native-release.mjs release-input dist/native
      - run: npm test
      - run: npm run check:versions
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/reporch-cli.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist/release-assets
          cp dist/tarballs/*.tgz dist/native/*.tar.gz dist/native/*.zip \
            dist/reporch-cli.spdx.json dist/release-manifest.json \
            dist/npm-pack-manifest.json dist/native/native-release-manifest.json \
            dist/release-assets/
          (cd dist/release-assets && shasum -a 256 ./*) > dist/SHA256SUMS
          (cd dist/release-assets && shasum -a 256 --check ../SHA256SUMS)
      - name: Attest immutable release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/release-assets/*
      - name: Create or verify the draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA"
          else
            release_flags=()
            release_notes=$'Official Apache-2.0 Reporch CLI release.\n\nInstall with `npm install --global @reporch/cli`, or download the standalone tar/zip for your target and verify it with `SHA256SUMS`. Every release asset has GitHub artifact provenance; manifests and an SPDX SBOM are included.\n\nThis release does not claim Apple Developer ID, notarization, or Windows Authenticode publisher signing. npm provenance and Reporch runtime signatures are the supported trust path.'
            if [ "$IS_PRERELEASE" = true ]; then
              release_flags+=(--prerelease)
              release_notes+=$'\n\nRC notice: macOS binaries are ad-hoc signed to preserve the virtualization entitlement; Windows binaries are not publisher-signed.'
            fi
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" "${release_flags[@]}" \
              --title "Reporch CLI $VERSION" \
              --notes "$release_notes"
          fi
          gh release upload "$RELEASE_TAG" dist/release-assets/* dist/SHA256SUMS --clobber
      - name: Publish exact npm tarballs with OIDC and provenance
        run: node scripts/publish-npm-release.mjs dist

  qualify-published-artifacts:
    if: github.actor == vars.SELF_HOSTED_ACTIONS_ALLOWED_ACTOR
    needs: [verify-source, publish]
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            archive_kind: tar
            npm_package: '@reporch/cli-darwin-arm64'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive_kind: tar
            npm_package: '@reporch/cli-darwin-x64'
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_kind: tar
            npm_package: '@reporch/cli-linux-x64-gnu'
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_kind: tar
            npm_package: '@reporch/cli-linux-arm64-gnu'
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive_kind: zip
            npm_package: '@reporch/cli-win32-x64-msvc'
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify-source.outputs.version }}
      RELEASE_TAG: ${{ needs.verify-source.outputs.tag }}
      TARGET: ${{ matrix.target }}
      ARCHIVE_KIND: ${{ matrix.archive_kind }}
      NPM_PACKAGE: ${{ matrix.npm_package }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.2.0"
          package-manager-cache: false

      - name: Download and exercise the published Unix artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          install_dir="$RUNNER_TEMP/native-install"
          npm_dir="$RUNNER_TEMP/npm-install"
          project="$RUNNER_TEMP/authoring-project"
          mkdir "$assets" "$install_dir" "$npm_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          # macOS 15 ships a BSD sha256sum compatibility command that does not
          # support GNU --check/--strict, so select the verifier by runner OS.
          if [ "$RUNNER_OS" = macOS ]; then
            (cd "$assets" && shasum -a 256 --check SHA256SUMS)
          else
            (cd "$assets" && sha256sum --check --strict SHA256SUMS)
          fi
          archive="$assets/reporch-v${VERSION}-${TARGET}.tar.gz"
          test -f "$archive"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          unset GH_TOKEN
          tar -xzf "$archive" -C "$install_dir"
          native="$install_dir/reporch-v${VERSION}-${TARGET}/reporch"
          test -x "$native"
          test "$("$native" --version)" = "reporch $VERSION"

          cd "$npm_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "@reporch/cli@$VERSION"
          npm_binary="$npm_dir/node_modules/.bin/reporch"
          test -x "$npm_binary"
          test "$("$npm_binary" --version)" = "reporch $VERSION"
          npm_native="$npm_dir/node_modules/$NPM_PACKAGE/bin/reporch"
          test -x "$npm_native"
          cmp "$native" "$npm_native"

          run_flow() {
            local binary=$1
            local evidence=$2
            "$binary" qualification-self-test > "$evidence"
            jq -e --arg version "$VERSION" '
              .schema == "reporch.cli-installed-self-test.v1"
              and .version == $version
              and .credential_store_round_trip == true
              and .generated_manifest_valid == true
              and .generated_authoring_spec_valid == true
              and .problem_type_count == 6
              and (.problem_types | sort) == ["grader", "interactive", "library", "output_only", "scored", "standard"]
              and .package_profile_count == 5
              and (.package_profiles | sort) == ["domjudge_zip", "icpc202509", "icpc_legacy", "polygon_compatible", "reporch_native"]
              and .compatibility_report_count == 30
              and .passed == true
            ' "$evidence" >/dev/null
          }
          if [ "$RUNNER_OS" = Linux ]; then
            "$native" qualification-self-test > "$RUNNER_TEMP/native-self-test.json"
            "$npm_binary" qualification-self-test > "$RUNNER_TEMP/npm-self-test.json"
            "$native" --format json auth status > "$RUNNER_TEMP/auth-status.json"
            node "$GITHUB_WORKSPACE/scripts/qualify-installed-auth.mjs" \
              --binary "$native" \
              --evidence "$RUNNER_TEMP/installed-auth-e2e.json"
            for evidence in "$RUNNER_TEMP/native-self-test.json" "$RUNNER_TEMP/npm-self-test.json"; do
              jq -e --arg version "$VERSION" '
                .schema == "reporch.cli-installed-self-test.v1"
                and .version == $version
                and .credential_store_round_trip == true
                and .generated_manifest_valid == true
                and .generated_authoring_spec_valid == true
                and .problem_type_count == 6
                and (.problem_types | sort) == ["grader", "interactive", "library", "output_only", "scored", "standard"]
                and .package_profile_count == 5
                and (.package_profiles | sort) == ["domjudge_zip", "icpc202509", "icpc_legacy", "polygon_compatible", "reporch_native"]
                and .compatibility_report_count == 30
                and .passed == true
              ' "$evidence" >/dev/null
            done
          else
            run_flow "$native" "$RUNNER_TEMP/native-self-test.json"
            run_flow "$npm_binary" "$RUNNER_TEMP/npm-self-test.json"
            "$native" --format json auth status > "$RUNNER_TEMP/auth-status.json"
            node "$GITHUB_WORKSPACE/scripts/qualify-installed-auth.mjs" \
              --binary "$native" \
              --evidence "$RUNNER_TEMP/installed-auth-e2e.json"
          fi

          jq -e '
            .schema == "reporch.cli-installed-auth-e2e.v1"
            and .device_authorization == true
            and .native_credential_restore == true
            and .refresh_rotation == true
            and .auth_status_p95_ms <= 100
            and .authenticated_studio_request == true
            and .device_session_management == true
            and .remote_revocation == true
            and .local_credential_removal == true
            and .passed == true
          ' "$RUNNER_TEMP/installed-auth-e2e.json" >/dev/null

          "$native" --format json project init --title "RC qualification" --directory "$project" \
            > "$RUNNER_TEMP/project-init.json"
          "$native" --cwd "$project" --format json check > "$RUNNER_TEMP/project-check.json"
          jq -e '.schema == "reporch.cli-result.v1" and .command == "project init"' \
            "$RUNNER_TEMP/project-init.json" >/dev/null
          jq -e '.schema == "reporch.cli-result.v1" and .command == "check"' \
            "$RUNNER_TEMP/project-check.json" >/dev/null
          jq -e '.schema == "reporch.cli-result.v1" and .data.authenticated == false' \
            "$RUNNER_TEMP/auth-status.json" >/dev/null

      - name: Download and exercise the published Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
          $install = Join-Path $env:RUNNER_TEMP 'native-install'
          $npmDir = Join-Path $env:RUNNER_TEMP 'npm-install'
          $project = Join-Path $env:RUNNER_TEMP 'authoring-project'
          New-Item -ItemType Directory $assets, $install, $npmDir | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $assets
          Get-Content (Join-Path $assets 'SHA256SUMS') | ForEach-Object {
            if ($_ -notmatch '^([a-f0-9]{64})  (.+)$') { throw 'invalid checksum entry' }
            $path = Join-Path $assets $Matches[2]
            if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $Matches[1]) {
              throw "checksum mismatch: $path"
            }
          }
          $archive = Join-Path $assets "reporch-v$env:VERSION-$env:TARGET.zip"
          if (!(Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'native archive is missing' }
          gh attestation verify $archive --repo $env:GITHUB_REPOSITORY
          Remove-Item Env:GH_TOKEN
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $native = Join-Path $install "reporch-v$env:VERSION-$env:TARGET/reporch.exe"
          if ((& $native --version) -ne "reporch $env:VERSION") { throw 'native version mismatch' }

          Push-Location $npmDir
          npm init --yes | Out-Null
          npm install --ignore-scripts --no-audit --no-fund "@reporch/cli@$env:VERSION"
          Pop-Location
          $npmBinary = Join-Path $npmDir 'node_modules/.bin/reporch.cmd'
          if ((& $npmBinary --version) -ne "reporch $env:VERSION") { throw 'npm version mismatch' }
          $npmNative = Join-Path $npmDir "node_modules/$env:NPM_PACKAGE/bin/reporch.exe"
          if ((Get-FileHash -Algorithm SHA256 $native).Hash -ne (Get-FileHash -Algorithm SHA256 $npmNative).Hash) {
            throw 'npm native binary differs from the independently attested GitHub release binary'
          }
          foreach ($entry in @(
            @{ Binary = $native; Evidence = (Join-Path $env:RUNNER_TEMP 'native-self-test.json') },
            @{ Binary = $npmBinary; Evidence = (Join-Path $env:RUNNER_TEMP 'npm-self-test.json') }
          )) {
            & $entry.Binary qualification-self-test | Set-Content -Encoding utf8 $entry.Evidence
            if ($LASTEXITCODE -ne 0) { throw 'installed qualification self-test failed' }
            $result = Get-Content -Raw $entry.Evidence | ConvertFrom-Json
            $expectedProblemTypes = @('grader', 'interactive', 'library', 'output_only', 'scored', 'standard')
            $expectedProfiles = @('domjudge_zip', 'icpc202509', 'icpc_legacy', 'polygon_compatible', 'reporch_native')
            $actualProblemTypes = @($result.problem_types | Sort-Object)
            $actualProfiles = @($result.package_profiles | Sort-Object)
            if (!$result.passed -or !$result.credential_store_round_trip -or !$result.generated_manifest_valid -or !$result.generated_authoring_spec_valid -or $result.version -ne $env:VERSION -or $result.problem_type_count -ne 6 -or (Compare-Object $expectedProblemTypes $actualProblemTypes) -or $result.package_profile_count -ne 5 -or (Compare-Object $expectedProfiles $actualProfiles) -or $result.compatibility_report_count -ne 30) {
              throw 'installed qualification evidence mismatch'
            }
          }
          node "$env:GITHUB_WORKSPACE/scripts/qualify-installed-auth.mjs" `
            --binary $native `
            --evidence (Join-Path $env:RUNNER_TEMP 'installed-auth-e2e.json')
          if ($LASTEXITCODE -ne 0) { throw 'installed OAuth qualification failed' }
          $authEvidence = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'installed-auth-e2e.json') | ConvertFrom-Json
          if (!$authEvidence.passed -or !$authEvidence.device_authorization -or !$authEvidence.native_credential_restore -or !$authEvidence.refresh_rotation -or $authEvidence.auth_status_p95_ms -gt 100 -or !$authEvidence.authenticated_studio_request -or !$authEvidence.device_session_management -or !$authEvidence.remote_revocation -or !$authEvidence.local_credential_removal) {
            throw 'installed OAuth qualification evidence mismatch'
          }
          & $native --format json project init --title 'RC qualification' --directory $project |
            Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'project-init.json')
          if ($LASTEXITCODE -ne 0) { throw 'project initialization failed' }
          & $native --cwd $project --format json check |
            Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'project-check.json')
          if ($LASTEXITCODE -ne 0) { throw 'project check failed' }
          & $native --format json auth status |
            Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'auth-status.json')
          if ($LASTEXITCODE -ne 0) { throw 'auth status failed' }
          $status = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'auth-status.json') | ConvertFrom-Json
          if ($status.schema -ne 'reporch.cli-result.v1' -or $status.data.authenticated) {
            throw 'auth status contract mismatch'
          }

      - name: Preserve installed authentication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-auth-${{ matrix.target }}
          path: ${{ runner.temp }}/installed-auth-e2e.json
          if-no-files-found: error
          retention-days: 1

  finalize-prerelease:
    if: github.actor == vars.SELF_HOSTED_ACTIONS_ALLOWED_ACTOR && needs.verify-source.outputs.prerelease == 'true'
    needs: [verify-source, qualify-published-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.verify-source.outputs.tag }}
    steps:
      - name: Publish the already-qualified RC draft
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_TAG" --draft=false --prerelease

  preserve-stable-candidate:
    if: github.actor == vars.SELF_HOSTED_ACTIONS_ALLOWED_ACTOR && needs.verify-source.outputs.prerelease == 'false'
    needs: [verify-source, qualify-published-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.verify-source.outputs.tag }}
    steps:
      - name: Keep stable candidate unlisted until explicit dist-tag promotion
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          echo "Exact 1.0 candidate qualified. npm candidate remains isolated; latest and the GitHub draft require explicit promotion."
