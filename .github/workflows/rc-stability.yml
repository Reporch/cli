name: RC stability monitor

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rc-stability-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.2.0"
          package-manager-cache: false

      - name: Initialize the evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/rc-stability-evidence"
          mkdir -p "$evidence"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_revision "$GITHUB_SHA" \
            '{schema:"reporch.cli-rc-stability-bootstrap.v1",run_id:$run_id,run_attempt:$run_attempt,source_revision:$source_revision}' \
            > "$evidence/bootstrap.json"

      - id: target
        name: Resolve the active RC stability window
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list --state open --limit 100 --json number,title,createdAt \
            > "$RUNNER_TEMP/open-beta-issues.json"
          issue_number=$(jq -er '
            [ .[]
              | select(.title | test("^Reporch CLI 1\\.0\\.0-rc\\.[0-9A-Za-z.-]+ — 30-day stability window$"))
            ]
            | sort_by(.createdAt)
            | last
            | .number
          ' "$RUNNER_TEMP/open-beta-issues.json")
          title=$(jq -er --argjson number "$issue_number" \
            '.[] | select(.number == $number) | .title' "$RUNNER_TEMP/open-beta-issues.json")
          version=$(sed -E 's/^Reporch CLI ([^ ]+) — 30-day stability window$/\1/' <<<"$title")
          [[ "$version" =~ ^1\.0\.0-rc\.[0-9A-Za-z.-]+$ ]]
          test "$(npm view @reporch/cli dist-tags.next)" = "$version"
          {
            echo "issue_number=$issue_number"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - id: verify
        name: Verify the published RC and production compatibility boundary
        shell: bash
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/rc-stability-evidence"
          project="$RUNNER_TEMP/rc-stability-project"
          mkdir -p "$evidence"
          npm view "@reporch/cli@$VERSION" --json > "$evidence/npm-package.json"
          jq -e --arg version "$VERSION" '
            .name == "@reporch/cli"
            and .version == $version
            and (.dist.integrity | startswith("sha512-"))
            and (.dist.shasum | test("^[a-f0-9]{40}$"))
          ' "$evidence/npm-package.json" >/dev/null
          GH_TOKEN="${{ github.token }}" gh release view "v$VERSION" \
            --json tagName,isDraft,isPrerelease,publishedAt,assets,url \
            > "$evidence/github-release.json"
          jq -e --arg tag "v$VERSION" '
            .tagName == $tag
            and (.isDraft | not)
            and .isPrerelease
            and ([.assets[] | select(.name == "SHA256SUMS" and (.digest | startswith("sha256:")))] | length == 1)
            and ([.assets[] | select(.name | test("^reporch-v.+-(aarch64-apple-darwin|x86_64-apple-darwin|aarch64-unknown-linux-gnu|x86_64-unknown-linux-gnu|x86_64-pc-windows-msvc)\\.(tar\\.gz|zip)$"))] | length == 5)
          ' "$evidence/github-release.json" >/dev/null

          curl --proto '=https' --tlsv1.2 --fail-with-body --show-error --silent \
            --retry 3 --retry-all-errors --max-time 20 \
            https://studio.reporch.com/health/ready \
            > "$evidence/studio-health.json"
          jq -e '.status == "ok"' "$evidence/studio-health.json" >/dev/null
          curl --proto '=https' --tlsv1.2 --fail-with-body --show-error --silent \
            --retry 3 --retry-all-errors --max-time 20 \
            https://studio.reporch.com/api/v1/capabilities \
            > "$evidence/studio-capabilities.json"
          jq -e '
            .schema == "reporch.studio-capabilities.v1"
            and (.api_versions | index("v1") != null)
            and (.authoring_spec_versions | index("reporch.authoring-spec.v2") != null)
            and (.release_manifest_versions | index("reporch.release-manifest.v2") != null)
            and .maximum_cli_major == 1
          ' "$evidence/studio-capabilities.json" >/dev/null
          curl --proto '=https' --tlsv1.2 --fail-with-body --show-error --silent \
            --retry 3 --retry-all-errors --max-time 20 \
            https://api.reporch.com/health/ \
            > "$evidence/control-health.json"
          jq -e '.status == "ok"' "$evidence/control-health.json" >/dev/null

          npm exec --yes --package="@reporch/cli@$VERSION" -- \
            reporch --version > "$evidence/version.txt"
          test "$(cat "$evidence/version.txt")" = "reporch $VERSION"
          npm exec --yes --package="@reporch/cli@$VERSION" -- \
            reporch --format json project init \
            --title "RC stability monitor" --directory "$project" \
            > "$evidence/project-init.json"
          npm exec --yes --package="@reporch/cli@$VERSION" -- \
            reporch --cwd "$project" --format json check \
            > "$evidence/project-check.json"
          jq -e '
            .schema == "reporch.cli-result.v1"
            and .command == "project init"
            and .data.schema == "reporch.project-status.v1"
            and .data.linked == false
            and .data.dirty == false
          ' "$evidence/project-init.json" >/dev/null
          jq -e '
            .schema == "reporch.cli-result.v1"
            and .command == "check"
            and .data.schema == "reporch.check-result.v1"
            and .data.authoring_schema == "reporch.authoring-spec.v2"
            and .data.release_schema == "reporch.release-manifest.v2"
            and .data.valid == true
          ' "$evidence/project-check.json" >/dev/null

          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg version "$VERSION" \
            --arg completed_at "$completed_at" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_revision "$GITHUB_SHA" \
            '{schema:"reporch.cli-rc-stability.v1",version:$version,completed_at:$completed_at,run_id:$run_id,source_revision:$source_revision,npm_registry:true,github_release:true,studio_health:true,studio_capabilities:true,control_health:true,fresh_install:true,project_init:true,offline_check:true,passed:true}' \
            > "$evidence/result.json"
          (cd "$evidence" && sha256sum ./* > SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rc-stability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc-stability-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Record the immutable daily result on the beta issue
        if: always() && steps.target.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          VERSION: ${{ steps.target.outputs.version }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          result=failed
          test "$VERIFY_OUTCOME" != success || result=passed
          observed_date=$(date -u +%Y-%m-%d)
          marker="<!-- reporch-cli-stability:${observed_date}:${result}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT} -->"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --paginate \
            > "$RUNNER_TEMP/stability-comments.json"
          if jq -e --arg marker "$marker" '[.[] | select(.body | contains($marker))] | length == 0' \
            "$RUNNER_TEMP/stability-comments.json" >/dev/null; then
            comment_body=$(printf '%s\nDaily RC monitor **%s** for %s on %s: %s' \
              "$marker" "$result" "$VERSION" "$observed_date" "$run_url")
            gh issue comment "$ISSUE_NUMBER" \
              --body "$comment_body"
          fi
