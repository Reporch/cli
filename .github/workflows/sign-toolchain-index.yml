name: Sign toolchain index

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Same-repository branch containing only a toolchain index update
        required: true
        type: string

permissions:
  contents: write

jobs:
  sign:
    if: github.repository == 'Reporch/cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted signer from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          ref: main
          persist-credentials: false

      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Restrict the unsigned change surface
        working-directory: candidate
        run: |
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = "artifacts/toolchains-v1.json"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-11
        with:
          toolchain: 1.96.0

      - name: Materialize signing key
        env:
          SIGNING_KEY: ${{ secrets.REPORCH_TOOLCHAIN_INDEX_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/toolchain-index.key"

      - name: Sign with trusted code only
        run: |
          rm candidate/artifacts/toolchains-v1.json.minisig
          cargo run --locked --manifest-path trusted/tools/toolchain-index-signer/Cargo.toml -- \
            candidate/artifacts/toolchains-v1.json \
            "$RUNNER_TEMP/toolchain-index.key" \
            candidate/artifacts/toolchains-v1.minisign.pub \
            candidate/artifacts/toolchains-v1.json.minisig
          rm "$RUNNER_TEMP/toolchain-index.key"

      - name: Verify candidate without signing material
        working-directory: candidate
        run: |
          cargo test --workspace --all-targets
          cargo run --quiet -p reporch-cli -- --format json toolchain list

      - name: Commit signature to candidate branch
        working-directory: candidate
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name reporch-release-bot
          git config user.email release-bot@users.noreply.github.com
          git add artifacts/toolchains-v1.json.minisig
          git diff --cached --check
          git commit -m 'chore(toolchains): sign index update'
          git push origin "HEAD:$BRANCH"
