[package]
name = "reporch-cli-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
reporch-format = { path = "../crates/reporch-format" }
studio-core = { path = "../crates/studio-core" }

[[bin]]
name = "authoring_yaml"
path = "fuzz_targets/authoring_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relative_path"
path = "fuzz_targets/relative_path.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
